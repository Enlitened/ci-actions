name: Await a simulator
description: >
  Resolve the simulator a destination should name — a per-repository clone on a
  self-hosted runner, the stock device on a hosted one — and wait until
  CoreSimulator has enumerated it.

# Two problems, one place to solve them.
#
# **A cold service reports no devices at all.** `xcodebuild` asks CoreSimulator
# for the device list once and fails outright if the answer is empty. On a cold
# runner the error is not "not ready" but:
#
#   Unable to find a device matching the provided destination specifier:
#           { platform:iOS Simulator, OS:latest, name:iPhone 17 Pro }
#   Available destinations for the "Japa" scheme:
#           { platform:macOS ... }
#           { platform:iOS ... placeholder }
#
# — an empty device list on a runner whose image ships five of them. It is
# transient: one job hit it on the same run where the job beside it, on the same
# image, resolved the same device fine. Asking again is what fixes it.
#
# **One Mac, several runners, one simulator.** Each iOS repo has its own runner
# on the same Mac, so their jobs can run at the same time, and all of them named
# `iPhone 17 Pro` — of which there was exactly one, with one UDID. Two
# `xcodebuild test` runs installing to and driving the same device is a race
# whose symptom is UI tests failing in ways that do not reproduce: dose-app went
# from nine failing tests to the two that are genuinely broken once it stopped
# sharing. So on a self-hosted runner this hands back a clone of its own,
# created on first use from the stock device's own type and runtime and left in
# place afterwards.
#
# Keyed on the runner, not the repository. A runner executes one job at a time,
# so a device belonging to one can never be contended — which stays true if a
# repo is ever given a second runner, where a per-repository name would put two
# of its own jobs back on one device and rebuild the bug.
#
# On a hosted runner it hands back the stock name unchanged: the image is
# exclusive to the job, there is nothing to collide with, and inventing devices
# would only make the run slower.
inputs:
  device:
    description: >
      The stock simulator name, exactly as the image publishes it — e.g.
      "iPhone 17 Pro". Not the per-runner name; this action derives that.
    required: true
  boot:
    description: >
      Boot the device before handing it back, and wait until SpringBoard is
      accepting launch requests — see the step for why a destination that will
      run tests needs this and why xcodebuild's own boot is not enough. A
      build-only destination has no use for it and should leave it off.
    required: false
    default: "false"
outputs:
  name:
    description: >
      The device name to put in a `-destination`. The input on a hosted runner,
      the per-repository clone on a self-hosted one.
    value: ${{ steps.resolve.outputs.name }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        DEVICE: ${{ inputs.device }}
      run: |
        # `resolve.py` sits beside this action; see it for why matching happens
        # on simctl's JSON rather than on its text listing.
        resolve() {
          xcrun simctl list devices available -j 2>/dev/null \
            | python3 "$GITHUB_ACTION_PATH/resolve.py" "$1"
        }

        if [ "${RUNNER_ENVIRONMENT:-github-hosted}" = "self-hosted" ]; then
          TARGET="$DEVICE ($RUNNER_NAME)"
        else
          TARGET="$DEVICE"
        fi

        for attempt in $(seq 1 30); do
          if resolve "$TARGET" >/dev/null; then
            echo "$TARGET available after ${attempt} attempt(s)"
            echo "name=$TARGET" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The clone is missing rather than the service being cold if the stock
          # device it would be cloned from is already answering. Only then is
          # creating one the right move — otherwise keep waiting, because a
          # CoreSimulator that has enumerated nothing yet would have us build a
          # device out of an answer it has not given.
          if [ "$TARGET" != "$DEVICE" ] && spec=$(resolve "$DEVICE"); then
            devicetype=${spec%%$'\t'*}
            runtime=${spec##*$'\t'}
            echo "creating $TARGET from ${devicetype##*.} on ${runtime##*.}"
            xcrun simctl create "$TARGET" "$devicetype" "$runtime" >/dev/null
            continue
          fi

          sleep 2
        done

        echo "::error::no simulator named '$TARGET' after 60s — either this machine dropped '$DEVICE' or CoreSimulator never came up"
        xcrun simctl list devices available || true
        exit 1

    # **xcodebuild installs into a simulator before SpringBoard is ready for it.**
    #
    # Handed a shut-down destination, `xcodebuild test` boots it, and installs
    # the app the moment CoreSimulator reports the boot complete. That report
    # comes when launchd_sim is up — SpringBoard, which is what actually opens
    # apps, is still starting, and does not load its application library (its
    # list of what is installed) for several more seconds: six on both Macs here,
    # seventeen on a device's first boot. An install that completes inside that
    # window is one SpringBoard never sees finish. It picks up the "install
    # started" notice for the placeholder when its library loads, the "install
    # finished" notice was sent before it was listening, and the app is left
    # flagged as updating for as long as the device stays booted. Every launch
    # request after that is refused — SpringBoard's own log says
    #
    #   Cannot launch application scene sceneID:com.colinsergay.Dose-default
    #   while it's application is being updated
    #
    # and xcodebuild reports it as
    #
    #   Failed to install or launch the test runner. (Underlying Error: Simulator
    #   device failed to launch com.colinsergay.Dose. The request was denied by
    #   service delegate (SBMainWorkspace) for reason: Busy ("Application failed
    #   preflight checks"))
    #
    # A run that fails this way has executed zero tests. It hit dose-app on most
    # pushes of 2026-09-05, on both Macs, in the unit step as often as the UI
    # step, and every attempt to explain it by what a *previous* run had left
    # behind was wrong: the device was clean, the disk was empty, the load was
    # low. The one green run followed a manual `simctl boot` — the
    # device was already up when xcodebuild reached it, so it installed into a
    # SpringBoard that was long since listening. That is all this step does,
    # deliberately, every time.
    #
    # `bootstatus -b` boots the device if it is down and returns when the boot is
    # *finished* — data migration included, which is what xcodebuild does not
    # wait for. Then the probe: open a system app and close it again. If
    # SpringBoard takes the request, it is loaded and will take xcodebuild's. A
    # device that is already booted passes both in about a second, and xcodebuild
    # leaves alone a device it did not boot, so on a self-hosted runner the
    # device stays up from one job to the next and the cost is paid once.
    - if: inputs.boot == 'true'
      shell: bash
      env:
        TARGET: ${{ steps.resolve.outputs.name }}
      run: |
        xcrun simctl bootstatus "$TARGET" -b

        for attempt in $(seq 1 30); do
          if xcrun simctl launch "$TARGET" com.apple.Preferences >/dev/null 2>&1; then
            xcrun simctl terminate "$TARGET" com.apple.Preferences >/dev/null 2>&1 || true
            echo "$TARGET is booted and SpringBoard is opening apps (probe attempt $attempt)"
            exit 0
          fi
          sleep 2
        done

        echo "::error::'$TARGET' reports booted but SpringBoard would not open an app in 60s — xcodebuild would fail the same way; see this step's comment"
        xcrun simctl spawn "$TARGET" log show --last 3m --predicate 'process == "SpringBoard"' --style compact 2>/dev/null | tail -40 || true
        exit 1
