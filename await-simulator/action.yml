name: Await a simulator
description: >
  Resolve the simulator a destination should name — a per-repository clone on a
  self-hosted runner, the stock device on a hosted one — and wait until
  CoreSimulator has enumerated it.

# Two problems, one place to solve them.
#
# **A cold service reports no devices at all.** `xcodebuild` asks CoreSimulator
# for the device list once and fails outright if the answer is empty. On a cold
# runner the error is not "not ready" but:
#
#   Unable to find a device matching the provided destination specifier:
#           { platform:iOS Simulator, OS:latest, name:iPhone 17 Pro }
#   Available destinations for the "Japa" scheme:
#           { platform:macOS ... }
#           { platform:iOS ... placeholder }
#
# — an empty device list on a runner whose image ships five of them. It is
# transient: one job hit it on the same run where the job beside it, on the same
# image, resolved the same device fine. Asking again is what fixes it.
#
# **One Mac, several runners, one simulator.** Each iOS repo has its own runner
# on the same Mac, so their jobs can run at the same time, and all of them named
# `iPhone 17 Pro` — of which there was exactly one, with one UDID. Two
# `xcodebuild test` runs installing to and driving the same device is a race
# whose symptom is UI tests failing in ways that do not reproduce: dose-app went
# from nine failing tests to the two that are genuinely broken once it stopped
# sharing. So on a self-hosted runner this hands back a clone of its own,
# created on first use from the stock device's own type and runtime and left in
# place afterwards.
#
# Keyed on the runner, not the repository. A runner executes one job at a time,
# so a device belonging to one can never be contended — which stays true if a
# repo is ever given a second runner, where a per-repository name would put two
# of its own jobs back on one device and rebuild the bug.
#
# On a hosted runner it hands back the stock name unchanged: the image is
# exclusive to the job, there is nothing to collide with, and inventing devices
# would only make the run slower.
#
# **A device that is listed is not a device that will run anything.** Waiting for
# CoreSimulator to enumerate the device was the whole of the check, and it passes
# for a device that has been left booted since a run that was killed — whose
# SpringBoard then refuses to open the app with `Busy ("Application failed
# preflight checks")`. Nothing retries that: `xcodebuild` reports it as a failed
# test having run no tests at all, and because the next job inherits the same
# device, the next run fails the same way. dose-app failed on this twice in one
# evening, once with both its unit and its UI step executing nothing, and it is
# indistinguishable from a real failure in the run summary. So on a self-hosted
# runner the resolved device is now also *reclaimed* before it is handed back —
# shut down if something left it up, and stripped of the parallel-testing clones
# a killed run leaks. Scoped by exact name to the runner's own device, because
# these runners share a Mac and reclaiming a neighbour's device mid-run would be
# the very fault this is here to prevent.
inputs:
  device:
    description: >
      The stock simulator name, exactly as the image publishes it — e.g.
      "iPhone 17 Pro". Not the per-runner name; this action derives that.
    required: true
outputs:
  name:
    description: >
      The device name to put in a `-destination`. The input on a hosted runner,
      the per-repository clone on a self-hosted one.
    value: ${{ steps.resolve.outputs.name }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        DEVICE: ${{ inputs.device }}
      run: |
        # `resolve.py` sits beside this action; see it for why matching happens
        # on simctl's JSON rather than on its text listing.
        resolve() {
          xcrun simctl list devices available -j 2>/dev/null \
            | python3 "$GITHUB_ACTION_PATH/resolve.py" "$1"
        }

        if [ "${RUNNER_ENVIRONMENT:-github-hosted}" = "self-hosted" ]; then
          TARGET="$DEVICE ($RUNNER_NAME)"
        else
          TARGET="$DEVICE"
        fi

        # Enumerated is not the same as usable; see `reclaim.py` for what is left
        # behind by a run that was killed, and why nothing retries past it.
        reclaim() {
          [ "${RUNNER_ENVIRONMENT:-github-hosted}" = "self-hosted" ] || return 0
          xcrun simctl list devices -j 2>/dev/null \
            | python3 "$GITHUB_ACTION_PATH/reclaim.py" "$1" \
            | while IFS=$'\t' read -r action udid name; do
                echo "reclaiming: $action $name"
                xcrun simctl "$action" "$udid" || true
              done
        }

        for attempt in $(seq 1 30); do
          if resolve "$TARGET" >/dev/null; then
            echo "$TARGET available after ${attempt} attempt(s)"
            reclaim "$TARGET"
            echo "name=$TARGET" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The clone is missing rather than the service being cold if the stock
          # device it would be cloned from is already answering. Only then is
          # creating one the right move — otherwise keep waiting, because a
          # CoreSimulator that has enumerated nothing yet would have us build a
          # device out of an answer it has not given.
          if [ "$TARGET" != "$DEVICE" ] && spec=$(resolve "$DEVICE"); then
            devicetype=${spec%%$'\t'*}
            runtime=${spec##*$'\t'}
            echo "creating $TARGET from ${devicetype##*.} on ${runtime##*.}"
            xcrun simctl create "$TARGET" "$devicetype" "$runtime" >/dev/null
            continue
          fi

          sleep 2
        done

        echo "::error::no simulator named '$TARGET' after 60s — either this machine dropped '$DEVICE' or CoreSimulator never came up"
        xcrun simctl list devices available || true
        exit 1
